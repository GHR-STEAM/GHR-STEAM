name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          pip install ruff bandit
      - name: Ruff check
        run: ruff check src/
      - name: Bandit security scan
        run: bandit -r src/ -ll

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mongodb-clients redis-tools postgresql-client
      - name: Install project deps
        run: |
          pip install -r requirements.txt
      - name: Wait for services
        run: |
          for i in {1..30}; do
            if mongosh --host 127.0.0.1 --port 27017 --eval "db.adminCommand({ping:1})" >/dev/null 2>&1; then echo "MongoDB is up"; break; fi
            sleep 2
          done
          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; then echo "Redis is up"; break; fi
            sleep 2
          done
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; then echo "Postgres is up"; break; fi
            sleep 2
          done
      - name: Export env vars
        run: |
          echo "MONGO_URI=mongodb://127.0.0.1:27017/testdb" >> $GITHUB_ENV
          echo "REDIS_URL=redis://127.0.0.1:6379" >> $GITHUB_ENV
          echo "POSTGRES_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/testdb" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/testdb" >> $GITHUB_ENV
          echo "REDIS_ENABLED=true" >> $GITHUB_ENV
      - name: Run Alembic migrations
        run: |
          alembic upgrade head
      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
