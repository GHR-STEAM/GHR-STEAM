name: Enhanced CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.10, 3.11]
    services:
      mongo:
        image: mongo:6.0
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y mongodb-clients redis-tools postgresql-client docker.io

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort flake8 pylint bandit pytest pytest-asyncio coverage requests

      - name: Wait for services
        run: |
          for i in {1..30}; do
            mongosh --host 127.0.0.1 --port 27017 --eval "db.adminCommand({ping:1})" >/dev/null 2>&1 && break
            echo "Waiting for MongoDB..." && sleep 2
          done
          for i in {1..30}; do
            redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1 && break
            echo "Waiting for Redis..." && sleep 2
          done
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1 && break
            echo "Waiting for Postgres..." && sleep 2
          done

      - name: Export env vars
        run: |
          echo "MONGO_URI=mongodb://127.0.0.1:27017/testdb" >> $GITHUB_ENV
          echo "REDIS_URL=redis://127.0.0.1:6379" >> $GITHUB_ENV
          echo "POSTGRES_URL=postgresql://postgres:postgres@127.0.0.1:5432/testdb" >> $GITHUB_ENV

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Format check (black + isort)
        run: |
          pip install black isort
          black --check .
          isort --check-only .

      - name: Static analysis (flake8 + pylint)
        run: |
          pip install flake8 pylint
          flake8 .
          pylint -E src || true

      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r src -f json -o bandit-report.json || true

      - name: Run Alembic migrations
        run: |
          python -m pip install alembic
          alembic -c alembic.ini upgrade head

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Slack notification (optional)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            STATUS="SUCCESS"
            if [ "${{ job.status }}" != "success" ]; then STATUS="FAILURE"; fi
            PAYLOAD="{\"text\":\"CI ${STATUS} - repo: ${GITHUB_REPOSITORY} branch: ${GITHUB_REF#refs/heads/}\"}"
            curl -s -X POST -H 'Content-type: application/json' --data "${PAYLOAD}" "${SLACK_WEBHOOK_URL}" || true
          else
            echo "No SLACK_WEBHOOK_URL secret set, skipping notification."
          fi
