name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install system deps for DB clients
        run: |
          sudo apt-get update
          sudo apt-get install -y mongodb-clients redis-tools postgresql-client

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f environment.yml ]; then
            pip install -r <(conda env export --from-history -f environment.yml 2>/dev/null) || pip install -r requirements.txt || true
          else
            pip install -r requirements.txt || true
          fi
        shell: bash

      - name: Wait for MongoDB, Redis, and PostgreSQL
        run: |
          for i in {1..30}; do
            if mongosh --host 127.0.0.1 --port 27017 --eval "db.adminCommand({ping:1})" >/dev/null 2>&1; then
              echo "MongoDB is up"
              break
            fi
            echo "Waiting for MongoDB..."
            sleep 2
          done

          for i in {1..30}; do
            if redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1; then
              echo "Redis is up"
              break
            fi
            echo "Waiting for Redis..."
            sleep 2
          done

          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -U testuser -d testdb >/dev/null 2>&1; then
              echo "PostgreSQL is up"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
        shell: bash

      - name: Export test env vars
        run: |
          echo "MONGO_URI=mongodb://127.0.0.1:27017/testdb" >> $GITHUB_ENV
          echo "REDIS_URL=redis://127.0.0.1:6379" >> $GITHUB_ENV
          echo "REDIS_ENABLED=true" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://testuser:testpass@127.0.0.1:5432/testdb" >> $GITHUB_ENV

      - name: Run Alembic migrations
        run: |
          python -m pip install alembic
          alembic -c alembic.ini upgrade head
        shell: bash

      - name: Run tests
        run: |
          pytest -q
        shell: bash
